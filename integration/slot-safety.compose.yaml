# Dedicated disposable database: CHECKPOINT may invalidate its replication slots.
x-slot-test: &slot-test
  environment:
    POSTGRES_USER: cdc
    POSTGRES_PASSWORD: mooncdc-test-only
    POSTGRES_DB: mooncdc_slot_safety
    POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
  command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4", "-c", "wal_sender_timeout=5s", "-c", "max_slot_wal_keep_size=0", "-c", "wal_keep_size=0", "-c", "min_wal_size=32MB", "-c", "max_wal_size=64MB", "-c", "checkpoint_timeout=1h"]
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U cdc -d mooncdc_slot_safety"]
    start_period: 60s
    interval: 1s
    timeout: 3s
    retries: 30
services:
  pg18:
    <<: *slot-test
    image: postgres:18.6
    ports: ["127.0.0.1:55428:5432"]
  pg17:
    <<: *slot-test
    image: postgres:17.11
    ports: ["127.0.0.1:55427:5432"]
