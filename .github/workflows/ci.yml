name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codec-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon update
      - run: moon run tools/codec-reference-test.mbtx
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon update
      - run: moon check --target native --deny-warn
      - run: moon test --target native
      - run: moon test tools/publish-check.mbtx
      - run: moon build --target native --release
      - run: moon info --target native && moon fmt --check
      - run: git diff --exit-code -- '*.mbti'
      - run: moon doc && moon package --list
      - run: moon run tools/package-test.mbtx
  postgres:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: pg18
            port: 55418
            slot_port: 55428
          - service: pg17
            port: 55417
            slot_port: 55427
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: docker compose -p mooncdc-test -f integration/compose.yaml up -d --wait ${{ matrix.service }}
      - run: moon version --all
      - run: moon update
      - run: moon run tools/setup-db.mbtx ${{ matrix.service }}
      - run: moon run tools/setup-tls.mbtx ${{ matrix.service }}
      # Native jobs run all unit/fault tests. Select only live scenarios here so
      # short-deadline peers never share a process with CPU-heavy SCRAM fixtures.
      - run: moon run tools/live-test.mbtx
        env:
          MOONCDC_TEST_PORT: ${{ matrix.port }}
          MOONCDC_TEST_CA: .test-artifacts/tls-${{ matrix.service }}/server.crt
      - run: moon run examples/index && moon run examples/cache
        env:
          MOONCDC_EXAMPLE_SERVICE: ${{ matrix.service }}
      - run: moon run tools/recovery-test.mbtx
        env:
          MOONCDC_EXAMPLE_SERVICE: ${{ matrix.service }}
      - run: moon run tools/checkpoint-crash-test.mbtx
        env:
          MOONCDC_EXAMPLE_SERVICE: ${{ matrix.service }}
      - run: moon run tools/pipeline-crash-test.mbtx
        env:
          MOONCDC_EXAMPLE_SERVICE: ${{ matrix.service }}
      - name: Start isolated WAL invalidation fixture
        run: docker compose -p mooncdc-slot-test -f integration/slot-safety.compose.yaml up -d --wait ${{ matrix.service }}
      - name: Check slot safety and quiet publication WAL
        run: moon test --target native --filter 'slot safety live*'
        env:
          MOONCDC_SLOT_TEST_PORT: ${{ matrix.slot_port }}
      - if: always()
        run: docker compose -p mooncdc-slot-test -f integration/slot-safety.compose.yaml logs
      - if: always()
        run: docker compose -p mooncdc-slot-test -f integration/slot-safety.compose.yaml down -v
      - if: always()
        run: docker compose -p mooncdc-test -f integration/compose.yaml logs
      - if: always()
        run: docker compose -p mooncdc-test -f integration/compose.yaml down -v
