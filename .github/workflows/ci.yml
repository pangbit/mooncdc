name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Resource evidence is scoped: the controlled compiler window used 256 tasks.
# The b96a741 Linux database diagnostic peaked at 264 under temporary 512/stop384,
# kept CPU4/memory6GiB/swap0, and restored 256 after cleanup. These are fixture
# budgets, not product minima or permanent permission to change a host limit.
# The GitHub-hosted jobs below set no aggregate TasksMax/pids.max; a green run
# here is separate evidence and must not claim that diagnostic's cgroup profile.
env:
  MOONBIT_TOOLCHAIN: '0.10.18+6c83a7f62'
jobs:
  commit-subjects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test subject grammar and Git event ranges
        run: python3 -B tools/commit-subject-check_test.py
      - name: Check introduced non-merge commit subjects
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: python3 -B tools/commit-subject-check.py --github-event "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME"
  codec-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure accepted Linux build stack
        run: |
          printf 'ulimit -S -s 65536\n' > "$RUNNER_TEMP/mooncdc-build-env.sh"
          echo "BASH_ENV=$RUNNER_TEMP/mooncdc-build-env.sh" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: false
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/install-moonbit.sh"
          bash "$RUNNER_TEMP/install-moonbit.sh" "$MOONBIT_TOOLCHAIN"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          test "$("$HOME/.moon/bin/moon" version | sed -n '1p')" = 'moon 0.1.20261028 (e1e1f15 2026-10-28)'
          test "$("$HOME/.moon/bin/moonc" -v)" = 'v0.10.18+6c83a7f62 (2026-10-28)'
      - run: moon update
      - run: moon run tools/codec-reference-test.mbtx
      - run: moon run tools/config-reference-test.mbtx
      - run: moon run tools/protocol-reference-test.mbtx
      - run: moon run tools/memory-reference-test.mbtx
      - run: moon run tools/memory-sampler-reference-test.mbtx
  native:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Configure accepted Linux build stack
        if: runner.os == 'Linux'
        run: |
          printf 'ulimit -S -s 65536\n' > "$RUNNER_TEMP/mooncdc-build-env.sh"
          echo "BASH_ENV=$RUNNER_TEMP/mooncdc-build-env.sh" >> "$GITHUB_ENV"
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/install-moonbit.sh"
          bash "$RUNNER_TEMP/install-moonbit.sh" "$MOONBIT_TOOLCHAIN"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          test "$("$HOME/.moon/bin/moon" version | sed -n '1p')" = 'moon 0.1.20261028 (e1e1f15 2026-10-28)'
          test "$("$HOME/.moon/bin/moonc" -v)" = 'v0.10.18+6c83a7f62 (2026-10-28)'
      - run: moon version --all
      - run: moon update
      - run: moon check . cmd/replicator internal/memory internal/yaml internal/saslprep --target native --deny-warn
      - name: Build native debug tests (Linux 64 MiB stack)
        timeout-minutes: 15
        run: |
          if [[ "$RUNNER_OS" == 'Linux' ]]; then ulimit -S -s 65536; fi
          moon test . cmd/replicator internal/memory internal/yaml internal/saslprep --target native --frozen --build-only
      - name: Run native debug tests (8 MiB stack)
        timeout-minutes: 5
        run: |
          ulimit -S -s 8192
          moon test . cmd/replicator internal/memory internal/yaml internal/saslprep --target native --frozen
      - name: Build native release tests (Linux 64 MiB stack)
        timeout-minutes: 25
        run: |
          if [[ "$RUNNER_OS" == 'Linux' ]]; then ulimit -S -s 65536; fi
          moon test . cmd/replicator internal/memory internal/yaml internal/saslprep --target native --frozen --release --build-only
      - name: Run native release tests (8 MiB stack)
        timeout-minutes: 5
        run: |
          ulimit -S -s 8192
          moon test . cmd/replicator internal/memory internal/yaml internal/saslprep --target native --frozen --release
      # Pure response-parser tests; `moon run` would upload a registry dry-run.
      - run: moon test tools/publish-check.mbtx
      - name: Check maintenance parser and allocation regressions
        run: |
          moon test tools/package-test.mbtx --target native
          moon test tools/replicator-config-test.mbtx --target native
          moon test tools/cli-active-promotion-test.mbtx --target native
          moon test tools/active-store-promotion-test.mbtx --target native
          python3 -B tools/package-footprint-sample_test.py
      - name: Build release CLI
        timeout-minutes: 15
        run: moon build --target native --release --frozen
      - run: moon run tools/replicator-config-test.mbtx
      - run: moon run tools/connection-options-asan.mbtx
      - run: moon run tools/memory-sampler-asan.mbtx
      - run: moon info --target native && moon fmt --check . tools/*.mbtx
      - run: git diff --exit-code -- '*.mbti'
      - run: moon doc && moon package --list
      - run: moon run tools/package-test.mbtx --target native
  postgres:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: pg18
            port: 55418
            slot_port: 55428
          - service: pg17
            port: 55417
            slot_port: 55427
    steps:
      - uses: actions/checkout@v5
      - name: Configure accepted Linux build stack
        run: |
          printf 'ulimit -S -s 65536\n' > "$RUNNER_TEMP/mooncdc-build-env.sh"
          echo "BASH_ENV=$RUNNER_TEMP/mooncdc-build-env.sh" >> "$GITHUB_ENV"
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/install-moonbit.sh"
          bash "$RUNNER_TEMP/install-moonbit.sh" "$MOONBIT_TOOLCHAIN"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          test "$("$HOME/.moon/bin/moon" version | sed -n '1p')" = 'moon 0.1.20261028 (e1e1f15 2026-10-28)'
          test "$("$HOME/.moon/bin/moonc" -v)" = 'v0.10.18+6c83a7f62 (2026-10-28)'
      - run: docker compose -p mooncdc-test -f integration/compose.yaml up -d --wait ${{ matrix.service }}
      - run: moon version --all
      - run: moon update
      - run: moon run tools/setup-db.mbtx ${{ matrix.service }}
      - run: moon run tools/setup-tls.mbtx ${{ matrix.service }}
      # Native jobs run all unit/fault tests. Select only live scenarios here so
      # short-deadline peers never share a process with CPU-heavy SCRAM fixtures.
      - run: moon run tools/live-test.mbtx
        env:
          MOONCDC_TEST_PORT: ${{ matrix.port }}
          MOONCDC_TEST_CA: .test-artifacts/tls-${{ matrix.service }}/server.crt
      - run: moon run examples/index && moon run examples/cache
        env:
          MOONCDC_EXAMPLE_SERVICE: ${{ matrix.service }}
      - run: moon run tools/recovery-test.mbtx
        env:
          MOONCDC_EXAMPLE_SERVICE: ${{ matrix.service }}
      - run: moon run tools/checkpoint-crash-test.mbtx
        env:
          MOONCDC_EXAMPLE_SERVICE: ${{ matrix.service }}
      - run: moon run tools/pipeline-crash-test.mbtx
        env:
          MOONCDC_EXAMPLE_SERVICE: ${{ matrix.service }}
      - run: moon run tools/pipeline-crash-test.mbtx
        env:
          MOONCDC_EXAMPLE_SERVICE: ${{ matrix.service }}
          MOONCDC_PIPELINE_FAILOVER: 'true'
      - run: moon run tools/clickhouse-test.mbtx
        env:
          MOONCDC_TEST_PORT: ${{ matrix.port }}
      - run: moon run tools/replicator-test.mbtx
        env:
          MOONCDC_EXAMPLE_SERVICE: ${{ matrix.service }}
      - run: moon run tools/replicator-test.mbtx
        env:
          MOONCDC_EXAMPLE_SERVICE: ${{ matrix.service }}
          MOONCDC_PIPELINE_FAILOVER: 'true'
          MOONCDC_REPLICATOR_FORMAT: yaml
      - run: moon run tools/standby-test.mbtx
        env:
          MOONCDC_EXAMPLE_SERVICE: ${{ matrix.service }}
      - run: moon run tools/standby-test.mbtx
        env:
          MOONCDC_EXAMPLE_SERVICE: ${{ matrix.service }}
          MOONCDC_STANDBY_FAILOVER: 'true'
      - run: moon run tools/migration-crash-test.mbtx
        env:
          MOONCDC_EXAMPLE_SERVICE: ${{ matrix.service }}
      - if: matrix.service == 'pg18'
        run: moon run tools/clickhouse-crash-test.mbtx
      # This driver exercises both PG17 and PG18 with pre-provisioned images.
      - name: Prepare active-store promotion images
        if: matrix.service == 'pg18'
        run: docker pull postgres:17.11
      - if: matrix.service == 'pg18'
        run: moon run tools/active-store-promotion-test.mbtx --target native
      - if: always()
        run: docker compose -p mooncdc-clickhouse-test -f integration/clickhouse.compose.yaml down -v
      - name: Start isolated WAL invalidation fixture
        run: docker compose -p mooncdc-slot-test -f integration/slot-safety.compose.yaml up -d --wait ${{ matrix.service }}
      - name: Check slot safety and quiet publication WAL
        run: moon test --target native --filter 'slot safety live*'
        env:
          MOONCDC_SLOT_TEST_PORT: ${{ matrix.slot_port }}
      - if: always()
        run: docker compose -p mooncdc-slot-test -f integration/slot-safety.compose.yaml logs
      - if: always()
        run: docker compose -p mooncdc-slot-test -f integration/slot-safety.compose.yaml down -v
      - if: always()
        run: docker compose -p mooncdc-test -f integration/compose.yaml logs
      - if: always()
        run: docker compose -p mooncdc-test -f integration/compose.yaml down -v
